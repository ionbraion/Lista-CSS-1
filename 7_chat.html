<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-chat.html</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html, body {
            min-height: 100vh;
        }

        body {
            background-color: #f0f2f5;
            /* Posicionamento do container no canto inferior direito usando position fixed/absolute */
            position: relative;
        }

        /* Container do Chat posicionado com position */
        .chat-container {
            width: 100%;
            max-width: 450px;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;

            /* Alinhamento ao canto inferior direito via position */
            position: absolute;
            right: 20px;
            bottom: 20px;
        }

        /* Cada grupo de mensagem força uma nova linha usando clear */
        .mensagem-grupo {
            clear: both;
            margin-bottom: 15px;
        }

        .remetente {
            font-size: 11px;
            color: #4a69bd;
            margin-bottom: 3px;
            display: block;
        }

        /* Alinhamento do remetente enviado à direita */
        .enviada .remetente {
            text-align: right;
        }

        /* Flutuação das Mensagens */
        .recebida .balao {
            float: left;
            background-color: #e8ecef;
        }

        .enviada .balao {
            float: right;
            background-color: #b2d8d8;
        }

        /* O Balão de Texto */
        .balao {
            max-width: 85%;
            border-radius: 8px;
            padding: 8px 45px 16px 12px; /* Reserva espaço para a hora */
            position: relative; /* Âncora para a hora em absolute */
        }

        /* Avatar flutuando */
        .avatar {
            font-size: 18px;
            line-height: 1;
        }

        .recebida .avatar {
            float: left;
            margin-right: 8px;
        }

        .enviada .avatar {
            float: right;
            margin-left: 8px;
        }

        .texto {
            font-size: 13px;
            color: #333;
            line-height: 1.3;
        }

        /* Hora presa no canto inferior direito com Position Absolute */
        .hora {
            font-size: 9px;
            color: #666;
            position: absolute;
            right: 8px;
            bottom: 3px;
        }

        /* Campo de Envio */
        .campo-envio {
            clear: both;
            padding-top: 10px;
        }

        .campo-envio input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            margin-bottom: 8px;
        }

        .campo-envio button {
            float: right;
            padding: 6px 16px;
            background-color: #e4e6eb;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Clearfix para fechar os floats dentro do container */
        .chat-container::after {
            content: "";
            display: table;
            clear: both;
        }
    </style>
</head>
<body>

    <div class="chat-container">

        <!-- Mensagem Recebida 1 -->
        <div class="mensagem-grupo recebida">
            <span class="remetente">Pedro Silva</span>
            <div class="balao">
                <span class="avatar">👤</span>
                <span class="texto">Olá, tudo bem?</span>
                <span class="hora">00:50</span>
            </div>
        </div>

        <!-- Mensagem Enviada 1 -->
        <div class="mensagem-grupo enviada">
            <span class="remetente">Eu</span>
            <div class="balao">
                <span class="avatar">👤</span>
                <span class="texto">Estou bem sim, e você?</span>
                <span class="hora">00:55</span>
            </div>
        </div>

        <!-- Mensagem Recebida 2 -->
        <div class="mensagem-grupo recebida">
            <span class="remetente">Pedro Silva</span>
            <div class="balao">
                <span class="avatar">👤</span>
                <span class="texto">
                    Vamos sair hoje? sabe conversar e Lorem ipsum dolor sit amet consectetur adipisicing elit. Illum ducimus
                </span>
                <span class="hora">01:01</span>
            </div>
        </div>

        <!-- Mensagem Enviada 2 -->
        <div class="mensagem-grupo enviada">
            <span class="remetente">Eu</span>
            <div class="balao">
                <span class="avatar">👤</span>
                <span class="texto">Criatura .....</span>
                <span class="hora">01:02</span>
            </div>
        </div>

        <!-- Área de Input -->
        <div class="campo-envio">
            <input type="text" placeholder="Digite sua mensagem">
            <button type="button">Enviar</button>
        </div>

    </div>

</body>
</html>
