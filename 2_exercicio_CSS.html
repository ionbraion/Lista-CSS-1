<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2 CSS</title>
    <style>
        h1 {
            font-family: Arial, sans-serif;
            color: green;
            text-align: center;
        }
        .paragrafo-1 {
            font-family: Arial, sans-serif;
            color: #1d3557;
        }
        .paragrafo-2 {
            font-family: 'Geordia' ,Times, serif;
            color: green ;
        }

        .paragrafo-3 {
      font-family: 'Courier New', Courier, monospace;
      color: #4a148c;
    }

    .destaque-amarelo {
      background-color: yellow;
      font-weight: bold;
      color: #000000;
    }

    .destaque-vermelho {
      color: #d32f2f;
      text-transform: uppercase;
      font-style: italic;
    }

    .destaque-borda {
      border: 1px dashed #4a148c;
      padding: 2px 4px;
    }
    </style>
</head>
<body>
    <h1>Exercício 2 lista 1 CSS</h1>

    <p class="paragrafo-1">
    Lorem ipsum dolor sit amet, <span class="destaque-amarelo">consectetur adipiscing</span> elit.
  </p>
    <p class="paragrafo-2">
        Sed ut perspiciatis unde <span class="destaque-vermelho">omnis iste</span> natus error sit voluptatem.
    </p>
    <p class="paragrafo-3">
    Nemo enim ipsam voluptatem quia <span class="destaque-borda">voluptas sit aspernatur</span> aut odit aut fugit.
  </p>

</body>
</html>
