<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 10 - Barquinho Animado no Mar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Cenário (Céu com Gradiente) */
        .cenario {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #87ceeb 0%, #e0f6ff 70%, #fff 100%);
        }

        /* --- NUVEM ANIMADA --- */
        .nuvem {
            position: absolute;
            top: 50px;
            left: -200px;
            width: 150px;
            height: 50px;
            background-color: #ffffff;
            border-radius: 50px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            animation: moverNuvem 25s linear infinite;
            z-index: 1;
        }

        /* Formato arredondado da nuvem com pseudo-elementos */
        .nuvem::before, .nuvem::after {
            content: '';
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
        }

        .nuvem::before {
            width: 70px;
            height: 70px;
            top: -30px;
            left: 20px;
        }

        .nuvem::after {
            width: 50px;
            height: 50px;
            top: -20px;
            left: 70px;
        }

        @keyframes moverNuvem {
            0% { left: -200px; }
            100% { left: 100vw; }
        }

        /* --- BARQUINHO EM VETOR (CSS PURO) --- */
        .barco-container {
            position: absolute;
            bottom: 120px;
            left: -150px;
            z-index: 2; /* Fica à frente do fundo e entre as ondas do mar */
            animation: navegar 12s linear infinite;
        }

        .barco {
            position: relative;
            width: 100px;
            height: 60px;
            animation: balancar 2s ease-in-out infinite alternate;
        }

        /* Casco do Barco */
        .casco {
            position: absolute;
            bottom: 0;
            width: 100px;
            height: 30px;
            background-color: #8b4513;
            border-radius: 0 0 40px 40px;
        }

        /* Vela do Barco */
        .vela {
            position: absolute;
            bottom: 30px;
            left: 45px;
            width: 0;
            height: 0;
            border-left: 35px solid transparent;
            border-bottom: 45px solid #ffffff;
        }

        /* Mastro */
        .mastro {
            position: absolute;
            bottom: 30px;
            left: 40px;
            width: 5px;
            height: 45px;
            background-color: #5c2c06;
        }

        /* Animações do Barco */
        @keyframes navegar {
            0% { left: -150px; }
            100% { left: 100vw; }
        }

        @keyframes balancar {
            0% { transform: rotate(-4deg) translateY(0px); }
            100% { transform: rotate(4deg) translateY(-5px); }
        }

        /* --- MAR ANIMADO --- */
        .mar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background-color: #1e90ff;
            z-index: 3;
            overflow: hidden;
        }

        /* Ondas com Pseudo-Elementos */
        .mar::before, .mar::after {
            content: '';
            position: absolute;
            left: 0;
            width: 200%;
            height: 100%;
        }

        .mar::before {
            top: -20px;
            background: radial-gradient(circle, transparent 20px, #1c86ee 20px);
            background-size: 40px 40px;
            animation: onda 3s linear infinite;
            opacity: 0.7;
        }

        .mar::after {
            top: -10px;
            background: radial-gradient(circle, transparent 15px, #1e90ff 15px);
            background-size: 30px 30px;
            animation: onda 2s linear infinite reverse;
        }

        @keyframes onda {
            0% { transform: translateX(0); }
            100% { transform: translateX(-40px); }
        }
    </style>
</head>
<body>

    <div class="cenario">
        <!-- Nuvem Animada -->
        <div class="nuvem"></div>

        <!-- Barquinho Animado -->
        <div class="barco-container">
            <div class="barco">
                <div class="mastro"></div>
                <div class="vela"></div>
                <div class="casco"></div>
            </div>
        </div>

        <!-- Mar Animado -->
        <div class="mar"></div>
    </div>

</body>
</html>
