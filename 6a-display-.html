<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6a</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .bloco{
        display: block; /* empurra qualquer outro elemento para a linha de baixo */
        width: 100%; /*ocupa 100% do espaço da tela ou do bloco na horizontal */
        height: 25vh; /*cada bloco ocupa 25% da altura disponível da tela */
        text-align: center; /*alinha o texto no centro horizontal do bloco */
        line-height: 100px; /*define a altura do texto em 100px */
        color: #ffffff; /*define a cor do texto em #ffffff (branco) */
        font-weight: bold; /*aplica negrito no texto */
        font-size: 18px; /*define a altura do texto em 18px */
    }

    .bloco-1{
        background-color: purple;
    }
    .bloco-2{
        background-color: green;
    }
    .bloco-3{
        background-color: red;
    }
    .bloco-4{
        background-color: yellow;
    }

    </style>
    
</head>
<body>
    <div class="bloco bloco-1">1</div>
    <div class="bloco bloco-2">2</div>
    <div class="bloco bloco-3">3</div>
    <div class="bloco bloco-4">4</div>
    
</body>
</html>
